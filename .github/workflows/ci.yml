name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel superseded runs on the same ref (e.g. new pushes to a PR branch).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck · Lint · Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # One `npm ci` covers every workspace — apps/mobile, apps/web and
      # packages/core share the root lockfile. The postinstall hook
      # (patch-package) applies the @supabase/supabase-js Hermes
      # dynamic-import patch to the hoisted copy in the root node_modules.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Runs both suites: jest (apps/mobile + packages/core + scripts) and
      # vitest (apps/web, including the mobile↔web interop tests).
      - name: Test
        run: npm test

  prebuild-smoke:
    # Exercises every config-plugin code path (apps/mobile/plugins/withUnityFramework.js)
    # on a checkout WITHOUT the git-lfs Unity artifacts — the iOS copy mod and
    # all Android mods must hit their warn-and-skip branches and still produce
    # a valid native project. Catches plugin syntax/anchor regressions without
    # multi-GB artifacts or a native toolchain.
    name: Expo prebuild smoke (config plugins)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # Install from the workspace root, not apps/mobile — the lockfile lives there.
      - name: Install dependencies
        run: npm ci
        working-directory: .

      - name: Prebuild Android
        run: npx expo prebuild --platform android --no-install

      - name: Prebuild iOS
        run: npx expo prebuild --platform ios --no-install

  e2e:
    # The assembled web app in a real browser with every provider mocked at the
    # network layer (apps/web/e2e/support.js): OpenAI, the Supabase retrieval
    # RPC and the study API are answered by fixtures, and the Unity build is
    # refused. No secrets are needed. Five flows: chat with citations and the
    # source drawer, the safety callout, the response-length setting, the
    # study's text arm end to end, and the arm guard.
    name: End-to-end (Playwright, mocked providers)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx --workspace apps/web playwright install --with-deps chromium

      - name: Run e2e
        run: npm run test:e2e
        env:
          CI: 'true'

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
