name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel superseded runs on the same ref (e.g. new pushes to a PR branch).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck · Lint · Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # One `npm ci` covers every workspace — apps/mobile, apps/web and
      # packages/core share the root lockfile. The postinstall hook
      # (patch-package) applies the @supabase/supabase-js Hermes
      # dynamic-import patch to the hoisted copy in the root node_modules.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Runs both suites: jest (apps/mobile + packages/core + scripts) and
      # vitest (apps/web, including the mobile↔web interop tests).
      - name: Test
        run: npm test

  prebuild-smoke:
    # Exercises every config-plugin code path (apps/mobile/plugins/withUnityFramework.js)
    # on a checkout WITHOUT the git-lfs Unity artifacts — the iOS copy mod and
    # all Android mods must hit their warn-and-skip branches and still produce
    # a valid native project. Catches plugin syntax/anchor regressions without
    # multi-GB artifacts or a native toolchain.
    name: Expo prebuild smoke (config plugins)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # Install from the workspace root, not apps/mobile — the lockfile lives there.
      - name: Install dependencies
        run: npm ci
        working-directory: .

      - name: Prebuild Android
        run: npx expo prebuild --platform android --no-install

      - name: Prebuild iOS
        run: npx expo prebuild --platform ios --no-install

  e2e:
    # The assembled web app in a real browser with every provider mocked at the
    # network layer (apps/web/e2e/support.js): OpenAI, ElevenLabs and Supabase
    # are answered by fixtures; the microphone, speech
    # recognition and the Unity build are scripted fakes. No secrets are
    # needed. Every user flow has a spec: landing, onboarding, home, chat,
    # library, settings, voice, the avatar and guest access, plus a
    # production-like project (Supabase on).
    name: End-to-end (Playwright, mocked providers)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx --workspace apps/web playwright install --with-deps chromium

      - name: Run e2e
        run: npm run test:e2e
        env:
          CI: 'true'

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  coverage:
    # Unit and e2e coverage, merged and checked against the agreed scope
    # (docs/testing/coverage.md, scripts/test/coverage-scope.mjs). The report
    # lands in the job summary. Enforcing: the gate step fails this job unless
    # every in-scope file is at 100% statements and lines, with no coverage-
    # ignore comments in scope. (Whether the job is a *required* check is a
    # branch-protection setting, not set here.)
    name: Coverage (unit + e2e, scope gate)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx --workspace apps/web playwright install --with-deps chromium

      - name: Unit coverage (jest, web, api)
        run: npm run test:coverage:mobile && UNIT_COVERAGE=1 npm test -w apps/web && npm run test:coverage:api

      - name: E2E coverage
        run: npm run test:coverage:e2e
        env:
          CI: 'true'

      - name: Coverage gate
        run: node scripts/test/coverage-gate.mjs --enforce

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-gate
          path: coverage/gate.md
          retention-days: 14
