# Chat with no API key — the state every fresh install starts in. The app has
# no mock or demo mode, so this is the chat path the Simulator can check
# end to end: the key banner, the disabled input, quick questions that do
# nothing, and the banner's link to Settings.
appId: com.anonymous.DementiaGuideAi
name: Chat — no credentials
tags:
  - chat
---
- runFlow: subflows/skip-onboarding.yaml
- tapOn:
    id: "tab-chat"
- extendedWaitUntil:
    visible: "Add your OpenAI API key in Settings to start chatting"
    timeout: 10000

- assertVisible: "(?s)Hello! I'm Aria, your DementiaGuide AI assistant.*"
- assertVisible: "Aria"
- assertVisible: "Online"
- assertVisible: "For informational purposes only — always consult a healthcare professional."
- assertVisible: "Message input"
- assertVisible: "Add your API key in Settings first"
- assertVisible: "Voice input"
- assertVisible: "Knowledge library"

# Quick questions are shown but blocked: nothing is sent and Aria never
# starts "Thinking…"
- assertVisible: "How do I manage sundowning?"
- tapOn: "How do I manage sundowning?"
- assertNotVisible: "Thinking…"
- assertVisible: "Online"
- assertVisible: "Add your OpenAI API key in Settings to start chatting"

# The banner takes you to the key setting
- tapOn: "Add API key in settings"
- extendedWaitUntil:
    visible: "Personalise your DementiaGuide AI experience"
    timeout: 10000
- scrollUntilVisible:
    element: "OpenAI API Key"
    direction: DOWN
    centerElement: true
- assertVisible: "Not configured"
